[package]
name = "ami-s3-archive"
version = "0.2.0"
edition = "2021"
rust-version = "1.76"
license = "MIT OR Apache-2.0"
description = "Standalone Rust CLI to archive an EC2 AMI into S3 STANDARD_IA via EC2 AMI Store/Restore APIs."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
