name: ami-s3-archive-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'ami-s3-archive/v*'

defaults:
  run:
    working-directory: ami-s3-archive

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ami-s3-archive dist/ami-s3-archive-linux-amd64
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ami-s3-archive-linux-amd64
          path: ami-s3-archive/dist/*

  windows-amd64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ami-s3-archive
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/ami-s3-archive.exe dist/ami-s3-archive-windows-amd64.exe
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ami-s3-archive-windows-amd64
          path: ami-s3-archive/dist/*

  macos-arm64:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ami-s3-archive
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/ami-s3-archive dist/ami-s3-archive-darwin-arm64
          shasum -a 256 dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ami-s3-archive-darwin-arm64
          path: ami-s3-archive/dist/*
